spring.application.name=rental_car_app
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/carrental}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

token-secret-key=${TOKEN_SECRET_KEY}
access-token-time=${ACCESS_TOKEN_TIME:1200000}
refresh_token-time=${REFRESH_TOKEN_TIME:8640000}
active_token-time=${ACTIVE_TOKEN_TIME:300000}
forgot_token-time=${FORGOT_TOKEN_TIME:300000}

spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS:true}

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
# Optional Google OAuth settings can be supplied through environment variables when enabled.